<p class="has-contrast-3-color has-text-color has-xs-font-size" style="margin-bottom:var(--wp--preset--spacing--3);font-weight:600;letter-spacing:0.05em;text-transform:uppercase">Documentation</p>

<!-- wp:heading {"level":1,"textColor":"contrast","fontSize":"3-xl","style":{"typography":{"fontWeight":"700","letterSpacing":"-0.02em"},"spacing":{"margin":{"bottom":"var:preset|spacing|6"}}}} -->
<h1 class="wp-block-heading has-contrast-color has-text-color has-3-xl-font-size" style="margin-bottom:var(--wp--preset--spacing--6);font-weight:700;letter-spacing:-0.02em">Documentation</h1>
<!-- /wp:heading -->
<!-- wp:paragraph {"textColor":"contrast-2"} -->
<p class="has-contrast-2-color has-text-color">Welcome to the Gratis WordPress Suite documentation. Choose a topic from the sidebar or browse below.</p>
<!-- /wp:paragraph -->
<!-- wp:html -->
<div class="gratis-docs-search-bar" style="margin:1.25rem 0 1.5rem">
  <input type="search" id="gratis-docs-filter" placeholder="Filter plugins… (e.g. cache, backup, SEO)" autocomplete="off"
    style="width:100%;padding:0.6rem 1rem;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#161a20;color:#e2e8f0;font-size:14px;outline:none"
    aria-label="Filter documentation cards">
  <p id="gratis-docs-filter-count" style="font-size:13px;color:#94a3b8;margin:0.5rem 0 0;min-height:1.2em"></p>
</div>
<script>
(function(){
  function initDocsFilter(){
    var input = document.getElementById('gratis-docs-filter');
    var counter = document.getElementById('gratis-docs-filter-count');
    if (!input) return;
    input.addEventListener('input', function(){
      var q = this.value.toLowerCase().trim();
      var cards = document.querySelectorAll('.gratis-docs-grid .gratis-doc-card');
      if (!cards.length) return;
      var shown = 0;
      cards.forEach(function(card){
        var text = card.textContent.toLowerCase();
        var visible = !q || text.indexOf(q) !== -1;
        card.style.display = visible ? '' : 'none';
        if (visible) shown++;
      });
      counter.textContent = q ? shown + ' of ' + cards.length + ' plugins match' : '';
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initDocsFilter);
  else initDocsFilter();
})();
</script>
<!-- /wp:html -->
<!-- wp:shortcode -->
[gratis_docs_grid]
<!-- /wp:shortcode -->
